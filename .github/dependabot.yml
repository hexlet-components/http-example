version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    # Свежий релиз неделю вылёживается: так не попасть на отозванную версию.
    cooldown:
      default-days: 7
    groups:
      all-npm-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    # Свежий релиз неделю вылёживается: так не попасть на отозванную версию.
    cooldown:
      default-days: 7
    groups:
      all-docker-dependencies:
        patterns:
          - '*'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 1
    # Свежий релиз неделю вылёживается: так не попасть на отозванную версию.
    cooldown:
      default-days: 7
    groups:
      all-github-actions-dependencies:
        patterns:
          - '*'
