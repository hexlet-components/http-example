version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    # Свежий релиз неделю вылёживается: так не попасть на отозванную версию.
    cooldown:
      default-days: 7
    groups:
      all-npm-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      all-npm-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    # Свежий релиз неделю вылёживается: так не попасть на отозванную версию.
    cooldown:
      default-days: 7
    groups:
      all-docker-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      all-docker-major:
        patterns: ['*']
        update-types: ['major']

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    open-pull-requests-limit: 2
    # Свежий релиз неделю вылёживается: так не попасть на отозванную версию.
    cooldown:
      default-days: 7
    groups:
      all-github-actions-minor-patch:
        patterns: ['*']
        update-types: ['minor', 'patch']
      all-github-actions-major:
        patterns: ['*']
        update-types: ['major']
