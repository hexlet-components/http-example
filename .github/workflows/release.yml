name: Build

on:
  push:
    branches:
      - main
  # Сборка проверяется и на пуллреквестах. Без этого поломка попадает в main и
  # обнаруживается только тем, что образ перестал собираться, а на проде
  # продолжает работать прежний. Так уже вышло: сборка стояла сломанной с
  # 3 августа. Публикацию образа это не задевает, у джобы deploy стоит
  # условие на push.
  pull_request:
    branches:
      - main

permissions: {}

# Прогон на пуллреквесте отменяется новым коммитом, а прогон на main нет:
# отменённая публикация образа оставила бы main без свежего образа.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5
        with:
          cache: false

      - name: Install
        run: mise run setup

      - name: Check
        run: mise run check

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ github.event_name == 'push' }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        with:
          cache-binary: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          cache-from: ghcr.io/${{ github.repository }}:latest
          cache-to: type=inline
          tags: ghcr.io/${{ github.repository }}:latest
