<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexlet UI Testing</title>
    <link rel="stylesheet" href="/assets/ui-testing/style.css" />
  </head>
  <body>
    <a href="/ui-testing">UI testing examples</a>
    <div class="example">
      <h3>Hovers</h3>
      <p>Hover over a user card to see the name. Double-click the name to select it.</p>
      <div class="figure"><div class="avatar">1</div><div class="figcaption"><h5>name: user1</h5><a href="/ui-testing/login">View profile</a></div></div>
      <div class="figure"><div class="avatar">2</div><div class="figcaption"><h5>name: user2</h5><a href="/ui-testing/login">View profile</a></div></div>
      <div class="figure"><div class="avatar">3</div><div class="figcaption"><h5>name: user3</h5><a href="/ui-testing/login">View profile</a></div></div>
      <p id="result"></p>
    </div>
    <script>
      for (const name of document.querySelectorAll('.figcaption h5')) {
        name.addEventListener('dblclick', () => {
          document.getElementById('result').textContent = `Selected ${name.textContent}`;
        });
      }
    </script>
    <footer>Powered by <a href="https://hexlet.io">Hexlet</a></footer>
  </body>
</html>
