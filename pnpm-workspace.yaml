packages: []

# Уязвимости из osv-scanner, которые обновлением прямых зависимостей не закрыть.
# @scalar/json-magic 0.13 прибивает undici 7.24.4 точной версией, @fastify/static
# просит glob ^13, а исправления в 13.x нет. Записи снимаются, когда зависимость
# сама поднимет версию.
overrides:
  'undici@7': 7.30.1
  'glob@13': ^14.0.3
